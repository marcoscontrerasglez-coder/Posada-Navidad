<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Navideña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page">

        <section class="hero">
            <div class="snow">❄ ✦ ❄ ✦ ❄</div>
            <div class="tree">🎄</div>

            <p class="eyebrow">Estás cordialmente invitado(a) a nuestra</p>
            <h1 id="nombrePosada">Posada Navideña 2026</h1>
            <p id="mensajePosada" class="message"></p>

            <div class="details">
                <div class="detail">
                    <span>📅</span>
                    <small>FECHA</small>
                    <strong id="fechaPosada"></strong>
                </div>
                <div class="detail">
                    <span>🕐</span>
                    <small>HORA</small>
                    <strong id="horaPosada"></strong>
                </div>
                <div class="detail">
                    <span>📍</span>
                    <small>LUGAR</small>
                    <strong id="lugarPosada"></strong>
                </div>
            </div>

            <div id="contador" class="countdown"></div>

            <div class="buttons">
                <button id="btnConfirmar" class="btn primary">🎟️ Confirmar asistencia</button>
                <button id="btnUbicacion" class="btn secondary">📍 Ver ubicación</button>
                <button id="btnMusica" class="btn secondary">🔊 Activar música</button>
            </div>
        </section>

        <section class="content-card">
            <h2>📍 Ubicación</h2>
            <p id="direccionPosada"></p>

            <div class="map-wrapper">
                <iframe
                    id="mapa"
                    title="Ubicación de la posada"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </section>

        <section id="formularioSeccion" class="content-card hidden">
            <h2>🎟️ Confirmación de asistencia</h2>
            <p class="muted">Completa los datos para registrar tu asistencia.</p>

            <form id="formAsistencia">
                <label>
                    Nombre completo
                    <input id="nombreInvitado" type="text" required maxlength="100">
                </label>

                <label>
                    ¿Asistirás?
                    <select id="asistira" required>
                        <option value="">Selecciona una opción</option>
                        <option value="si">Sí, asistiré</option>
                        <option value="no">No podré asistir</option>
                    </select>
                </label>

                <div id="datosAsistencia" class="hidden">
                    <label>
                        ¿Llevarás acompañantes?
                        <select id="llevaAcompanantes">
                            <option value="0">No</option>
                            <option value="1">Sí</option>
                        </select>
                    </label>

                    <div id="cantidadAcompanantesWrap" class="hidden">
                        <label>
                            Cantidad de acompañantes
                            <input id="cantidadAcompanantes" type="number" min="1" max="20" value="1">
                        </label>
                    </div>

                    <div id="acompanantesContainer"></div>

                    <label>
                        ¿Quieres participar en el intercambio de chalecos?
                        <select id="participaChalecos">
                            <option value="">Selecciona una opción</option>
                            <option value="si">Sí, participaré</option>
                            <option value="no">No participaré</option>
                        </select>
                    </label>

                    <div id="chalecosContainer" class="hidden">
                        <label>
                            ¿Cuántas personas participarán en el intercambio?
                            <input id="cantidadChalecos" type="number" min="1" max="20" value="1">
                        </label>
                        <div id="participantesChaleco"></div>
                    </div>
                </div>

                <button class="btn primary submit" type="submit">✅ Confirmar datos</button>
            </form>

            <div id="resultado" class="result hidden" aria-live="polite"></div>
        </section>

        <footer>
            <span>🎄</span> Te esperamos para celebrar juntos <span>🎄</span>
        </footer>

    </main>

    <audio id="audioNavidad" loop preload="none"></audio>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
